<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./embed-lang.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperPrompt Image Reverse</title>
  <link rel="stylesheet" href="../shared/styles/fonts.css">
  <link rel="stylesheet" href="./embed.css">
  <link rel="stylesheet" href="./reverse.css">
</head>
<body>
<div id="hp-embed-root">
  <section class="reverse-shell" data-hp-surface-size-root role="dialog" aria-modal="true" aria-labelledby="reverse-title">
    <header class="hp-embed-titlebar">
      <div class="reverse-heading">
        <h1 id="reverse-title" class="hp-embed-title">HyperPrompt</h1>
        <span id="reverse-status" class="reverse-status" role="status" aria-live="polite"></span>
      </div>
      <button id="reverse-stop" class="reverse-btn danger" type="button" hidden></button>
      <button id="reverse-close" class="hp-embed-close" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </header>
    <main class="reverse-main">
      <figure class="reverse-preview-wrap" aria-hidden="true">
        <img id="reverse-preview" class="reverse-preview" alt="">
      </figure>
      <div id="reverse-output" class="reverse-output" aria-live="polite"></div>
    </main>
    <footer class="reverse-actions">
      <button id="reverse-copy" class="reverse-btn secondary" type="button" hidden></button>
      <button id="reverse-retry" class="reverse-btn secondary" type="button" hidden></button>
      <button id="reverse-start" class="reverse-btn primary" type="button" disabled></button>
    </footer>
  </section>
</div>
<script src="../shared/asset-shell.js"></script>
<script src="../shared/builtin-rules.js"></script>
<script src="../shared/overlay-locales.js"></script>
<script src="../content/content-common.js"></script>
<script src="../content/content-streaming.js"></script>
<script src="./embed-common.js"></script>
<script src="../content/content-rules.js"></script>
<script src="./page-image.js"></script>
<script src="./reverse.js"></script>
</body>
</html>
